# Decap CMS config — редактирование без кода.
# Backend: github + собственный OAuth-релей (code→token). Работает и на Netlify, и на Coolify.
# Версия под Netlify (git-gateway + Netlify Identity) живёт в ветке `netlify`.
# Контент лежит в src/content/*.json — эти файлы читает сайт (src/lib/content.ts).

backend:
  name: github
  repo: DevianoCub/redcrescent
  branch: main
  # TODO: URL OAuth-релея после деплоя на Coolify (пример: https://oauth.redcrescent.uz).
  # Релей — маленький сервис, обменивающий GitHub code → access_token (client_secret нельзя держать во фронте).
  base_url: https://oauth.example.com
  auth_endpoint: auth

locale: ru
media_folder: public/photos/real
public_folder: /photos/real

collections:
  - name: site
    label: 'Сайт: контакты, соцсети, донаты'
    files:
      - name: site
        label: Общие настройки
        file: src/content/site.json
        fields:
          - { name: contacts, label: Контакты, widget: object, fields: [
            { name: address_ru, label: 'Адрес (RU)', widget: string },
            { name: address_uz, label: 'Адрес (UZ)', widget: string },
            { name: address_en, label: 'Адрес (EN)', widget: string },
            { name: phone, label: Телефон, widget: string },
            { name: fax, label: Факс, widget: string },
            { name: email, label: Email, widget: string }] }
          - { name: socials, label: Соцсети, widget: object, fields: [
            { name: facebook, label: Facebook URL, widget: string },
            { name: telegram, label: Telegram URL, widget: string },
            { name: instagram, label: Instagram URL, widget: string }] }
          - { name: donate_links, label: 'Ссылки оплаты', widget: list, fields: [
            { name: id, label: ID, widget: select, options: [click, payme, uzum] },
            { name: name, label: Название, widget: string },
            { name: url, label: URL, widget: string }] }

  - name: news
    label: Новости
    files:
      - name: news
        label: Список новостей
        file: src/content/news.json
        fields:
          - name: items
            label: Новости
            label_singular: Новость
            widget: list
            summary: '{{fields.title_ru}} — {{fields.date_ru}}'
            fields:
              - { name: id, label: ID (латиница, без пробелов), widget: string }
              - { name: published, label: Опубликовано, widget: boolean, default: true }
              - { name: category_ru, label: 'Категория (RU)', widget: string, required: false }
              - { name: category_uz, label: 'Категория (UZ)', widget: string, required: false }
              - { name: category_en, label: 'Категория (EN)', widget: string, required: false }
              - { name: date_ru, label: 'Дата (RU)', widget: string }
              - { name: date_uz, label: 'Дата (UZ)', widget: string, required: false }
              - { name: date_en, label: 'Дата (EN)', widget: string, required: false }
              - { name: title_ru, label: 'Заголовок (RU)', widget: string }
              - { name: title_uz, label: 'Заголовок (UZ)', widget: string, required: false }
              - { name: title_en, label: 'Заголовок (EN)', widget: string, required: false }
              - { name: excerpt_ru, label: 'Анонс (RU)', widget: text }
              - { name: excerpt_uz, label: 'Анонс (UZ)', widget: text, required: false }
              - { name: excerpt_en, label: 'Анонс (EN)', widget: text, required: false }
              - { name: body_ru, label: 'Текст (RU)', widget: text, required: false }
              - { name: body_uz, label: 'Текст (UZ)', widget: text, required: false }
              - { name: body_en, label: 'Текст (EN)', widget: text, required: false }
              - { name: image, label: Главное фото, widget: image, required: false }
              - name: gallery
                label: 'Фото галерея'
                widget: list
                required: false
                field: { name: image, label: Фото, widget: image }

  - name: laws
    label: Законы и документы
    files:
      - name: laws
        label: Список документов
        file: src/content/laws.json
        fields:
          - name: items
            label: Документы
            label_singular: Документ
            widget: list
            summary: '{{fields.title_ru}}'
            fields:
              - { name: id, label: ID, widget: string }
              - { name: title_ru, label: 'Название (RU)', widget: string }
              - { name: title_uz, label: 'Название (UZ)', widget: string, required: false }
              - { name: title_en, label: 'Название (EN)', widget: string, required: false }
              - { name: meta_ru, label: 'Описание (RU)', widget: string, required: false }
              - { name: meta_uz, label: 'Описание (UZ)', widget: string, required: false }
              - { name: meta_en, label: 'Описание (EN)', widget: string, required: false }
              - { name: pdf, label: 'PDF файл', widget: file, required: false }

  - name: offices
    label: Региональные отделения
    files:
      - name: offices
        label: Отделения
        file: src/content/offices.json
        fields:
          - name: items
            label: Отделения
            label_singular: Отделение
            widget: list
            summary: '{{fields.city}}'
            fields:
              - { name: id, label: ID, widget: string }
              - { name: type, label: 'Тип', widget: select, options: [
                  { label: 'Область', value: viloyat },
                  { label: 'Республика', value: respublika },
                  { label: 'Город', value: shahar },
                  { label: 'Отраслевое (ж/д)', value: tarmoq }] }
              - { name: name, label: 'Название (организация)', widget: string }
              - { name: city, label: Город, widget: string }
              - { name: address, label: Адрес, widget: string }
              - { name: phone, label: Телефон, widget: string }
              - { name: email, label: Email, widget: string, required: false }
              - { name: rais, label: Председатель, widget: string }
              - { name: director, label: 'Исполнительный директор', widget: string }
              - { name: lat, label: Широта, widget: number, value_type: float }
              - { name: lng, label: Долгота, widget: number, value_type: float }
